server {

    server_name rammie-blog.xyz www.rammie-blog.xyz;
    root /var/www/rammie-blog/;

	index index.html;

    client_max_body_size 0;

    access_log /var/log/nginx/rammie-blog.xyz.access.log;
    error_log /var/log/nginx/rammie-blog.xyz.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rammie-blog.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rammie-blog.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


} 
server {
    if ($host = www.rammie-blog.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = rammie-blog.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name rammie-blog.xyz www.rammie-blog.xyz;
    return 404; # managed by Certbot




}
